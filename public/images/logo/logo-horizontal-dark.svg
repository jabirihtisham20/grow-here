<svg viewBox="0 0 460 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
    

    <!-- Logomark (Left Squircle) -->
    <g transform="translate(10, 8)">
      <!-- Outer Squircle -->
      <rect x="2" y="2" width="80" height="80" rx="22" ry="22" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- G Letterform -->
      <path d="M 37 23 C 34 21.5 30 20.5 26 20.5 C 15 20.5 9 29.5 9 44 C 9 58.5 15.5 67.5 26 67.5 C 31 67.5 35 65.5 38 63" 
            stroke="#FAF7F2" stroke-width="4.8" stroke-linecap="round" />
      <path d="M 38 49 L 38 63" stroke="#FAF7F2" stroke-width="4.4" stroke-linecap="round" />
      <path d="M 28 49 L 40 49" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round" />

      <!-- H Letterform -->
      <path d="M 41 32 L 41 67" stroke="#FAF7F2" stroke-width="4.4" stroke-linecap="round" />
      <path d="M 38 32 L 44 32" stroke="#FAF7F2" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 38 67 L 44 67" stroke="#FAF7F2" stroke-width="2.8" stroke-linecap="round" />

      <path d="M 41 49 L 58 49" stroke="#FAF7F2" stroke-width="3.6" stroke-linecap="round" />

      <path d="M 58 24 L 58 67" stroke="#FAF7F2" stroke-width="4.6" stroke-linecap="round" />
      <path d="M 54 24 L 62 24" stroke="#FAF7F2" stroke-width="2.8" stroke-linecap="round" />
      <path d="M 54 67 L 63 67" stroke="#FAF7F2" stroke-width="2.8" stroke-linecap="round" />

      <!-- Leaf Accent -->
      <path d="M 48 46 C 49 39 55 29 65 22 C 65 31 60 39 52 44 Z" 
            fill="#7C9A82" />
      <path d="M 47 47 Q 56 36 64 23" 
            stroke="#FAF7F2" stroke-width="1" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Refined Vertical Divider Line -->
    <line x1="116" y1="20" x2="116" y2="80" stroke="#FAF7F2" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round" />

    <!-- Brand Typography -->
    <g transform="translate(138, 0)">
      <!-- Wordmark: G R O W H E R E -->
      <text x="0" y="50" 
            font-family="Georgia, 'Times New Roman', serif" 
            font-size="28" 
            font-weight="500" 
            letter-spacing="7" 
            fill="#FAF7F2">
        GROWHERE
      </text>

      <!-- Tagline: Grow a better way of living. -->
      <text x="2" y="73" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="300" 
            font-style="italic" 
            letter-spacing="0.8" 
            fill="#FAF7F2" 
            opacity="0.75">
        Grow a better way of living.
      </text>
    </g>
  </svg>